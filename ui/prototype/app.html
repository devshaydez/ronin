<style>

.sr.wt{opacity:.55}.sr.k{border-color:var(--teal)}
.sr::after{content:"";position:absolute;left:0;bottom:0;height:2px;background:var(--teal);width:0}.sr.rn::after{animation:fill var(--d) linear forwards}.sr.dn::after{width:100%;opacity:.25}

.hero2{border-radius:28px;padding:34px;display:flex;gap:28px;align-items:center;border:1px solid var(--line);margin-top:18px;background:radial-gradient(640px 260px at 0 0,var(--gc),transparent 70%),var(--card)}

.pf{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px}.pf .card{padding:20px}.pf p{margin:8px 0 0;font-size:14px}.pf b{font-weight:500}
@media(max-width:860px){.pt{grid-template-columns:1fr 1fr}.pt.h{display:none}.hero2{flex-direction:column;align-items:flex-start}.pf{grid-template-columns:1fr}.tabs{overflow-x:auto;min-width:0;flex:1}.tabs button{padding:8px 11px;font-size:13px}.pt.u{margin:0 -14px;padding:16px 14px}}
.tabs button{padding:8px 14px}
.q{display:grid;grid-template-columns:110px 1.2fr 1fr auto;gap:12px;padding:13px 0;border-top:1px solid var(--line);align-items:center;font-size:14px}.q:first-of-type{border-top:0}
@media(max-width:860px){.q{grid-template-columns:1fr 1fr}}
@media(max-width:860px){.g2,.pg,.og{grid-template-columns:1fr}.hd{gap:8px;padding:0 14px}.hd .badge,.logo span{display:none}.tabs{margin:0}.tabs button{padding:8px 11px}main{padding:20px 14px}.big{font-size:44px}.sr{margin-left:calc(var(--l)*14px)}.kv{grid-template-columns:1fr 1fr}.ddb{padding:0 10px 0 12px;gap:6px}.ddm{right:-30px}}

@media(max-width:860px){.hd{flex-wrap:wrap;height:auto;padding:10px 14px;row-gap:10px}.hd .badge{display:inline-block;font-size:11px;padding:2px 8px;order:0}.logo{margin-right:auto}.logo span{display:none}.dd{position:static;order:1}#wal{order:2}.ddm{position:absolute;left:14px;right:14px;top:calc(100% + 6px);min-width:0}.tabs{order:5;flex:none;width:100%;overflow-x:auto;scrollbar-width:none;margin:0}.tabs::-webkit-scrollbar{display:none}.tabs button{padding:10px 14px;white-space:nowrap;font-size:14px}.btn.sm{height:40px}.chip{padding:8px 14px}.seg button{padding:9px 16px}main{padding:18px 14px 60px}h1{font-size:28px}.big{font-size:40px}.row{flex-wrap:wrap}.li{flex-direction:column;gap:4px}.card .li>a{padding-left:46px}.bn{flex-direction:column;align-items:flex-start}.kv{grid-template-columns:1fr 1fr}.kv>div[style]{grid-column:1/-1!important}.og{display:flex;flex-direction:column}.og .card[style*=sticky]{position:static!important}.f,.inp input{font-size:16px}.sr{grid-template-columns:28px 1fr}.sr>div:last-child{grid-column:2;text-align:left!important}.lat{font-size:44px}.mo{display:inline-flex!important;align-items:center}}
