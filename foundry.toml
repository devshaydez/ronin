[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.29"
# cancun: Reactive Lasna (and Base/Unichain Sepolia) run Cancun, and forge's local simulation of the
# Lasna system contract fails with `EvmError: NotActivated` under paris. Cancun is safe on all deploy targets.
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# via_ir avoids "stack too deep" in the callback functions with many arguments.
via_ir = true
